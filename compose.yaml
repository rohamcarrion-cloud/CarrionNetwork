services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: carrion_network
      POSTGRES_USER: carrion
      POSTGRES_PASSWORD: carrion_local_only
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - carrion_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carrion -d carrion_network"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  carrion_pg:
